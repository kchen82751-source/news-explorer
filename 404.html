<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading News Explorer</title>
    <script>
      const appBase = "/news-explorer";
      const appPath = window.location.pathname.startsWith(appBase)
        ? window.location.pathname.slice(appBase.length) || "/"
        : "/";
      const returnTo = `${appPath}${window.location.search}${window.location.hash}`;
      window.location.replace(`${appBase}/?redirect=${encodeURIComponent(returnTo)}`);
    </script>
  </head>
  <body></body>
</html>
